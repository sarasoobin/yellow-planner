<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    색연필로 그린 별. 한붓그리기라 가운데에 선이 지나간다.

    꼭짓점 다섯을 하나 건너씩 이으면(위 → 오른아래 → 왼쪽 → 오른쪽 → 왼아래 → 위)
    펜을 떼지 않고 한 번에 그린 별이 된다. 종이에 별을 그릴 때 하는 그 방식이라
    가운데 오각형 자리에 선이 남는다.

    자로 잰 별처럼 보이지 않게 세 가지를 넣었다.
      1. 꼭짓점을 조금씩 어긋나게 잡는다
      2. 시작한 자리를 조금 지나쳐 끝낸다 (한 번에 그은 흔적)
      3. feTurbulence 로 획 가장자리를 흔들어 잔 결을 낸다

    획을 두 번 긋는다. 진한 획 하나, 살짝 비껴서 옅은 획 하나.
    색연필이 같은 자리를 두 번 지나며 남기는 모양이다.
  -->
  <defs>
    <filter id="crayon" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.8"
        numOctaves="3"
        seed="7"
        result="grain"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="grain"
        scale="0.9"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </defs>

  <g
    filter="url(#crayon)"
    stroke="#C1453C"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <!-- 진한 획. 끝이 시작을 조금 지나쳐 겹친다 -->
    <path
      d="M12.1 2.9 17.5 19.5 3.2 9.1 20.8 9.4 6.5 19.6 12.1 2.9 12.8 4.9"
      stroke-width="1.6"
    />

    <!-- 옅은 결 — 같은 길을 살짝 비껴 한 번 더 -->
    <path
      d="M12.5 3.5 17.1 19.0 3.9 9.6 20.3 9.9 7.0 19.1 12.5 3.5"
      stroke-width="0.7"
      opacity="0.45"
    />
  </g>
</svg>
